apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/KE-WhyNot/INFRA
    targetRevision: develop
    path: k8s/policy-service/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: policy-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground     
      - PruneLast=true
    retry:                                   
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
