# Default values for finance-service
# This is a YAML-formatted file.

# Finance Service configuration
name: finance-service
component: finance-service
partOf: microservices
# Image configuration
image:
  registry: ""
  repository: docker.io/9september/finance-service
  tag: "b84b50a1c5520ee74ae4be589c081524b498899e" # This will be updated by CI/CD
# Replica count
replicaCount: 1
# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# Service configuration
service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8081
      protocol: TCP
      name: http
# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # CORS 설정
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://finance.youth-fi.com, https://youth-fi.com, https://www.youth-fi.com, http://localhost:5173, http://localhost:8081"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,PUT,POST,DELETE,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Authorization,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-User-Id"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
  hosts:
    - host: "finance.youth-fi.com" # Cloudflare 도메인
      paths:
        - path: /
          pathType: Prefix
          servicePort: 80
# ConfigMap configuration
configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8081"
    LOGGING_LEVEL_ROOT: "INFO"
# Secret configuration
secret:
  enabled: true
# Environment variables
env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8081"
  MANAGEMENT_SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "info,health,metrics"
  # From Secret: finance-service-secrets
  # Database configuration
  SPRING_DATASOURCE_URL:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATASOURCE_URL
  SPRING_DATASOURCE_USERNAME:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATASOURCE_USERNAME
  SPRING_DATASOURCE_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATASOURCE_PASSWORD
  
  # Redis configuration
  SPRING_DATA_REDIS_HOST:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATA_REDIS_HOST
  SPRING_DATA_REDIS_PORT:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATA_REDIS_PORT
  SPRING_DATA_REDIS_TIMEOUT:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATA_REDIS_TIMEOUT
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE
  SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT
  
  # KIS API Keys
  KIS_API_KEY_1_APPKEY:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: KIS_API_KEY_1_APPKEY
  KIS_API_KEY_1_APPSECRET:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: KIS_API_KEY_1_APPSECRET
  KIS_API_KEY_2_APPKEY:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: KIS_API_KEY_2_APPKEY
  KIS_API_KEY_2_APPSECRET:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: KIS_API_KEY_2_APPSECRET
  
  # AI Service configuration
  AI_BASE_URL:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: AI_BASE_URL
  AI_GCP_SERVICE_ACCOUNT_EMAIL:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: AI_GCP_SERVICE_ACCOUNT_EMAIL
  AI_GCP_SERVICE_ACCOUNT_KEY_FILE:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: AI_GCP_SERVICE_ACCOUNT_KEY_FILE
  AI_TARGET_AUDIENCE:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: AI_TARGET_AUDIENCE
  
  # LLM API configuration
  LLM_API_URL:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: LLM_API_URL
  LLM_API_TIMEOUT:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: LLM_API_TIMEOUT
  LLM_API_RETRY_MAX_ATTEMPTS:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: LLM_API_RETRY_MAX_ATTEMPTS
  LLM_API_RETRY_DELAY:
    valueFrom:
      secretKeyRef:
        name: finance-service-secrets
        key: LLM_API_RETRY_DELAY

# Resources
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi
# Pod configuration
podAnnotations: {}
# Health checks
startupProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# Service account
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true
# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
