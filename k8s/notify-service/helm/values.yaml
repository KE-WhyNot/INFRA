 # Default values for notify-service
# This is a YAML-formatted file.

# Notify Service configuration
name: notify-service
component: notify-service
partOf: microservices
# Image configuration
image:
  registry: ""
  repository: docker.io/9september/notify-service
  tag: "bae74ae99e105dc5289fa0a34dd9de3fd1815cc5" # This will be updated by CI/CD
# Replica count
replicaCount: 2
# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# Service configuration
service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8083
      protocol: TCP
      name: http
# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # CORS 설정
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://notify.youth-fi.com, https://youth-fi.com, https://www.youth-fi.com, http://localhost:5173, http://localhost:8083, http://localhost:3000"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,PUT,POST,DELETE,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Authorization,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-User-Id"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
  hosts:
    - host: "notify.youth-fi.com" # Cloudflare 도메인
      paths:
        - path: /
          pathType: Prefix
          servicePort: 80
# ConfigMap configuration
configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8083"
    LOGGING_LEVEL_ROOT: "INFO"
# Secret configuration
secret:
  enabled: false
# Environment variables
env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"
  SERVER_PORT: "8083"
  MANAGEMENT_SERVER_PORT: "8083"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "info"
  # From Secret: notify-secrets
  SPRING_DATASOURCE_URL:
    valueFrom:
      secretKeyRef:
        name: notify-secrets
        key: spring.datasource.url
  SPRING_DATASOURCE_USERNAME:
    valueFrom:
      secretKeyRef:
        name: notify-secrets
        key: spring.datasource.username
  SPRING_DATASOURCE_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: notify-secrets
        key: spring.datasource.password
  SPRING_DATASOURCE_DRIVER_CLASS_NAME:
    valueFrom:
      secretKeyRef:
        name: notify-secrets
        key: spring.datasource.driver-class-name
  # Apache Kafka configuration
  KAFKA_BOOTSTRAP_SERVERS:
    valueFrom:
      secretKeyRef:
        name: notify-secrets
        key: KAFKA_BOOTSTRAP_SERVERS
  KAFKA_USERNAME:
    valueFrom:
      secretKeyRef:
        name: notify-secrets
        key: KAFKA_USERNAME
  KAFKA_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: notify-secrets
        key: KAFKA_PASSWORD
  KAFKA_GROUP_ID:
    valueFrom:
      secretKeyRef:
        name: notify-secrets
        key: KAFKA_GROUP_ID
# Resources
resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
# Service account
serviceAccount:
  create: true
  name: ""
# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false # Spring Boot가 임시 파일을 생성할 수 있도록 수정
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
