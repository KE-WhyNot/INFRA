# k8s/policy-service/helm/values.yaml
name: policy-service
component: policy-service
partOf: microservices

image:
  registry: ""
  repository: docker.io/9september/policy-service
  tag: "latest"   # CI

replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://policy.youth-fi.com, https://youth-fi.com, https://www.youth-fi.com, http://localhost:5173, http://localhost:8082"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,PUT,POST,DELETE,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Authorization,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-user-Id"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
  hosts:
    - host: "policy.youth-fi.com"
      paths:
        - path: /
          pathType: Prefix
          servicePort: 80

configMap:
  enabled: true
  data:
    ENVIRONMENT: "production"
    PORT: "8080"
    LOG_LEVEL: "INFO"

secret:
  enabled: false

env:
  ENVIRONMENT: "production"
  PORT: "8080"
  HOST: "0.0.0.0"
  LOG_LEVEL: "INFO"
  RELOAD: "false"
  
  # FastAPI 설정
  APP_NAME: "policy-service"
  APP_VERSION: "1.0.0"
  DOCS_URL: "/docs"
  REDOC_URL: "/redoc"
  OPENAPI_URL: "/openapi.json"
  
  # PostgreSQL 연결 설정 (FastAPI + SQLAlchemy)
  DATABASE_URL:
    valueFrom:
      secretKeyRef: { name: policy-secrets, key: database.url }
  DATABASE_USER:
    valueFrom:
      secretKeyRef: { name: policy-secrets, key: database.username }
  DATABASE_PASSWORD:
    valueFrom:
      secretKeyRef: { name: policy-secrets, key: database.password }
  DATABASE_HOST:
    valueFrom:
      secretKeyRef: { name: policy-secrets, key: database.host }
  DATABASE_PORT:
    valueFrom:
      secretKeyRef: { name: policy-secrets, key: database.port }
  DATABASE_NAME:
    valueFrom:
      secretKeyRef: { name: policy-secrets, key: database.name }
  
  # SQLAlchemy 연결 풀 설정
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "3600"

resources:
  limits: { cpu: 300m, memory: 512Mi }
  requests: { cpu: 100m, memory: 256Mi }

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop: [ "ALL" ]