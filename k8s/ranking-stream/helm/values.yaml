# Default values for ranking-stream
# This is a YAML-formatted file.

# Ranking Stream Service configuration
name: ranking-stream
component: ranking-stream
partOf: microservices
# Image configuration
image:
  registry: ""
  repository: docker.io/9september/ranking-stream
  tag: "e544e3e493fd5d06bb5efa1e44dc82bb78f2a18c" # This will be updated by CI/CD
# Replica count
replicaCount: 1
# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# Service configuration
service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8084
      protocol: TCP
      name: http
# Ingress configuration (disabled for stream service)
ingress:
  enabled: false
# ConfigMap configuration
configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8084"
    LOGGING_LEVEL_ROOT: "INFO"
# Secret configuration
secret:
  enabled: false
# Environment variables
env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8084"
  MANAGEMENT_SERVER_PORT: "8084"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "info"
  # From Secret: ranking-stream-secrets
  KAFKA_BOOTSTRAP_SERVERS:
    valueFrom:
      secretKeyRef:
        name: ranking-stream-secrets
        key: KAFKA_BOOTSTRAP_SERVERS
  KAFKA_USERNAME:
    valueFrom:
      secretKeyRef:
        name: ranking-stream-secrets
        key: KAFKA_USERNAME
  KAFKA_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: ranking-stream-secrets
        key: KAFKA_PASSWORD
# Resources
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi
# Pod configuration
podAnnotations: {}
# Health checks disabled for stream service
startupProbe: null
livenessProbe: null
readinessProbe: null
# Service account
serviceAccount:
  create: true
  name: ""
# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
